name: Build Apple TV IPA (for Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    name: Build tvOS IPA
    runs-on: macos-14
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: ⚙️ Expo Prebuild (Generate native tvOS project)
        env:
          EXPO_TV: "1"
        run: npx expo prebuild --platform ios --clean

      - name: 🍏 CocoaPods Install
        env:
          EXPO_TV: "1"
        run: |
          cd ios
          pod install

      - name: 🔨 Build tvOS App (Unsigned)
        run: |
          cd ios
          ls -la
          
          # Check for workspace or xcodeproj
          if ls -d *.xcworkspace 1> /dev/null 2>&1; then
            WORKSPACE_NAME=$(ls -d *.xcworkspace | head -n 1)
            BUILD_TARGET="-workspace $WORKSPACE_NAME"
          elif ls -d *.xcodeproj 1> /dev/null 2>&1; then
            PROJECT_NAME=$(ls -d *.xcodeproj | head -n 1)
            BUILD_TARGET="-project $PROJECT_NAME"
          else
            echo "Error: No Xcode project or workspace found in ios directory"
            exit 1
          fi

          echo "Detected Build Target: $BUILD_TARGET"

          # Detect primary scheme
          SCHEME=$(xcodebuild $BUILD_TARGET -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' \t\r' | head -n 1)
          if [ -z "$SCHEME" ]; then
            SCHEME="HomeHub TV"
          fi
          echo "Detected Scheme: '$SCHEME'"

          xcodebuild build \
            $BUILD_TARGET \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -sdk appletvos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -derivedDataPath build

      - name: 📦 Package into IPA for Sideloadly
        run: |
          mkdir -p Payload
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: '$APP_PATH'"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: .app bundle not found in build directory"
            find . -maxdepth 8
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -r HomeHubTV.ipa Payload
          rm -rf Payload

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeHubTV-AppleTV-IPA
          path: HomeHubTV.ipa
          retention-days: 14
